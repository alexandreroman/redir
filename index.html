<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>redir</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css" />
    <style>
        .github-fork-ribbon:before {
            background-color: black;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        h1 {
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        p {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #94a3b8;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <a class="github-fork-ribbon right-top" href="https://github.com/alexandreroman/redir" data-ribbon="Fork me on GitHub" title="Fork me on GitHub">Fork me on GitHub</a>
    <div>
        <h1>redir</h1>
        <p>a GitOps-friendly URL shortener</p>
    </div>
</body>
</html>
